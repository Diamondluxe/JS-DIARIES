<!DOCTYPE html>
<html>
    <head>
        <title>Advance Counter App</title>
        <meta charset="UTF-8">
    </head>

    <style>
        
        body{
            text-align: center;
            font-family: Arial;
            background-color: White;
            margin-top: 80px;
        }

        h1{
            color: darkblue;
        }

        #count{
            font-size: 70px;
            color: black;
        }

        #message{
            font-size: 28px;
            font-weight: bold;
        }

        #clicks{
            font-size: 22px;
        }

        button{
            padding: 12px 25px;
            font-size: 20px;
            margin: 10px;
            cursor: pointer;
            border: none;
            border-radius: 8px;
        }

        #plus{
            background: green;
            color: white;
        }

        #minus{
            background: red;
            color: white;
        }

        #reset{
            background: orange;
            color: white;
        }

        #plus5{
            background: lightgreen;
            color: white;
        }

        #minus5{
            background: rebeccapurple;
            color: white;
        }

        #double{
            background: aqua;
            color: white;
        }

    </style>

    <body>

        <h1>Counter App</h1>

        <h2 id="count">0</h2>
        
        <p id="message">😐Counter is Zero</p>

        <p id="clicks">Button Clicks : 0</p> 

        <button id="plus">+</button> 

        <button id="minus">-</button> 

        <button id="reset">Reset</button>

        <button id="plus5">+5</button>
        
        <button id="minus5" >-5</button>
        
        <button id="double">×2 Double</button>

        <script src="MiniProject-4.js"></script>

    </body>
</html>
